<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #ff6f00;
      --primary-light: #ff9100;
      --primary-dark: #d85c00;
      --accent: #ffb703;
      --bg-dark: #160a03;
      --bg-gradient: linear-gradient(135deg, #1c0c02 0%, #2f1201 50%, #441700 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #2b170c;
      --text-muted: #6e5e55;
      --border-color: rgba(255, 111, 0, 0.15);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-sm);
      padding: 2rem 3rem;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: var(--primary);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 1rem;
    }

    button,
    .login-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
      display: inline-block;
      text-decoration: none;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .error {
      color: #f87171;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button id="loginBtn" class="login-btn">Login</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const DEFAULT_URL = "https://ogtbnapgwikhnfhxlhuc.supabase.co";
    const DEFAULT_KEY = "sb_publishable_XSwOF7YnCpf2iFw1SAAsFA_TjbljZXQ";

    let dbClient = null;
    function initSupabase() {
      const url = localStorage.getItem("supabase_url") || DEFAULT_URL;
      const key = localStorage.getItem("supabase_key") || DEFAULT_KEY;
      dbClient = supabase.createClient(url, key);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      loginBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { data, error } = await dbClient.auth.signInWithPassword({ email, password });
        if (error) {
          errorMsg.textContent = 'Invalid username or password';
        } else {
          window.location.href = 'admin.html';
        }
      });
    });
  </script>
</body>

</html>
